name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run tests on'
        required: false
        default: 'main'
      base_url:
        description: 'Base URL (environment) to run tests against'
        required: false
        default: ''
      spec:
        description: 'Spec file(s) to run — e.g. cypress/e2e/api/posts.cy.ts or cypress/e2e/api/** (leave blank to run all)'
        required: false
        default: ''

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          config: ${{ github.event.inputs.base_url != '' && format('baseUrl={0}', github.event.inputs.base_url) || '' }}
          spec: ${{ github.event.inputs.spec != '' && github.event.inputs.spec || '' }}

      - name: Upload test reports and screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-results
          path: |
            cypress/reports/
            cypress/screenshots/
          retention-days: 7
